name: Hashnode Canonical Syndication

on:
  schedule:
    # Runs daily at 12:00 UTC (offset from Bluesky, Mastodon, and Pinterest cadences)
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  syndicate:
    name: Syndicate Articles to Hashnode
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Hashnode Syndicator Engine
        env:
          HASHNODE_TOKEN: ${{ secrets.HASHNODE_TOKEN }}
          HASHNODE_PUBLICATION_ID: ${{ secrets.HASHNODE_PUBLICATION_ID }}
        run: |
          python hashnode_engine.py

      - name: Commit Syndication State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state/hashnode_history.json
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore(hashnode): record syndicated publication state [skip ci]"
            git push
          fi
